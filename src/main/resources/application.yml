spring:
  application:
    name: trustvault
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/trustvault;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  address: 0.0.0.0
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 20m
      cookie:
        http-only: true
        same-site: strict
        secure: ${TRUSTVAULT_COOKIE_SECURE:false}
        path: /
app:
  storage-dir: ${TRUSTVAULT_STORAGE_DIR:./data/private-files}
  audit-hmac-key: ${TRUSTVAULT_AUDIT_HMAC_KEY:DEV-ONLY-CHANGE-ME-TRUSTVAULT-HMAC-KEY-2026}
  file-encryption-key: ${TRUSTVAULT_FILE_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  seed-demo-data: ${TRUSTVAULT_SEED_DEMO:true}
  bootstrap-admin-email: ${TRUSTVAULT_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${TRUSTVAULT_BOOTSTRAP_ADMIN_PASSWORD:}
  max-upload-bytes: 10485760
logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
